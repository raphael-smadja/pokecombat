name: Ligue

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Un run sur main remplit le cache Maven partagé par toutes les PR (le cache d'une PR ne sert qu'à elle).
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau push annule le run précédent de la même PR : la CI reste courte en live.
concurrency:
  group: ligue-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp compile

  tests:
    name: Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B -ntp test

  mutation:
    name: Mutation
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: PIT sur le package combat (rouge sous 80 %)
        run: ./mvnw -B -ntp test-compile org.pitest:pitest-maven:mutationCoverage
      - name: Pokédex des mutants
        if: ${{ !cancelled() }}
        run: python3 scripts/resume_pit.py >> "$GITHUB_STEP_SUMMARY"
      # Le rapport est publié même quand le badge est rouge : la review IA en a besoin.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pit-reports
          path: target/pit-reports
          if-no-files-found: ignore

  review-ia:
    name: Review IA
    needs: mutation
    # La review tourne aussi quand le badge Mutation est rouge : c'est là qu'elle sert le plus.
    if: ${{ github.event_name == 'pull_request' && !cancelled() && (needs.mutation.result == 'success' || needs.mutation.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: pit-reports
          path: target/pit-reports

      # Par défaut, l'IA conseille et PIT bloque.
      - name: Review du professeur (consultative)
        if: ${{ vars.REVUE_BLOQUANTE != 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/revue-pokecombat ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Write,Grep,Glob,Skill"

      # Variante bloquante : variable de repo REVUE_BLOQUANTE=true (Settings > Secrets and variables > Actions > Variables).
      - name: Review du professeur (bloquante)
        id: revue-bloquante
        if: ${{ vars.REVUE_BLOQUANTE == 'true' }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: "/revue-pokecombat ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: >-
            --max-turns 15
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Read,Write,Grep,Glob,Skill"
            --json-schema '{"type":"object","properties":{"bloquants":{"type":"integer"},"resume":{"type":"string"}},"required":["bloquants","resume"]}'
      - name: Verdict du professeur
        if: ${{ vars.REVUE_BLOQUANTE == 'true' }}
        env:
          VERDICT: ${{ steps.revue-bloquante.outputs.structured_output }}
        run: |
          bloquants=$(echo "$VERDICT" | jq -r '.bloquants')
          echo "$VERDICT" | jq -r '.resume'
          echo "Problèmes bloquants : $bloquants"
          test "$bloquants" -eq 0
